name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cit
          POSTGRES_PASSWORD: cit
          POSTGRES_DB: cit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cit" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      CIT_TEST_DATABASE_URL: postgresql+psycopg://cit:cit@localhost:5432/cit_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check cit tests
      - run: uv run pytest -q
      - name: Dependency audit
        run: uv run pip-audit --strict --progress-spinner off || echo "::warning::pip-audit reported issues"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser smoke tests (desktop + mobile)
        run: npx playwright install --with-deps chromium && npm run e2e
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
